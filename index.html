<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- a phone: added to the home screen it runs fullscreen and landscape -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tunnelbana" />
    <title>Tunnelbana</title>
    <meta
      name="description"
      content="A top-down extraction roguelite in the real Stockholm tunnelbana. Hold the platform, catch your train, don't miss the last one. Alpha."
    />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f16" />
    <!-- anonymous visit counts, no cookies (src/net/track.ts) -->
    <script
      data-goatcounter="https://teacentralen.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
    <!-- THE CARD a shared link shows. Scrapers want ABSOLUTE urls -->
    <link rel="canonical" href="https://teacentralen.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://teacentralen.com/" />
    <meta property="og:title" content="Tunnelbana" />
    <meta
      property="og:description"
      content="A top-down extraction roguelite in the real Stockholm tunnelbana. Get where you are going."
    />
    <meta property="og:image" content="https://teacentralen.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tunnelbana" />
    <meta
      name="twitter:description"
      content="A top-down extraction roguelite in the real Stockholm tunnelbana. Get where you are going."
    />
    <meta name="twitter:image" content="https://teacentralen.com/og.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b10;
        overflow: hidden;
      }
      /* SIDEWAYS (render/display.ts): the canvas and the overlays over a run
         are laid out landscape and turned a quarter clockwise */
      html.tb-sideways body > canvas,
      html.tb-sideways #tb-touch,
      html.tb-sideways #tb-ride-done,
      html.tb-sideways #tb-resume {
        position: fixed;
        top: 0;
        left: 0;
        right: auto;
        bottom: auto;
        width: var(--tb-sh) !important;
        height: var(--tb-sw) !important;
        transform-origin: top left;
        transform: rotate(90deg) translateY(-100%);
      }
      canvas {
        display: block;
        /* a finger on the game is a control, never a scroll or a zoom */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
